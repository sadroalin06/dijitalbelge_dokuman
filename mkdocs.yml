#site_name:  API Dokümantasyonu
site_description: DijitalBelge External API entegrasyon rehberi — e-imza, mobil imza ve elektronik belge imzalama süreçlerini REST API ile yönetin
site_name: DijitalBelge API Dokümantasyon
site_url: https://dokuman.dijitalbelge.com


theme:
  name: material
  language: tr
  logo: assets/dark-logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Koyu temaya geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Açık temaya geç
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Başlangıç:
      - index.md
      - API Erişimi (ClientId): authentication.md
      - Yetkiler: scopes.md
      - İmzalama Türleri: signature-types.md
      - Postman Koleksiyonu: postman.md
      - Hatalar: errors.md
  - Entegrasyon Akışları:
      - akislar/index.md
      - Belge İmzalama: akislar/belge-imzalama.md
      - Dijital Onay: akislar/dijital-onay.md
      - Kimlik Doğrulama: akislar/kimlik-dogrulama.md
      - Login: akislar/login.md
  - Belge Doğrulama:
      - dogrulama/index.md
      - Doğrulama API: dogrulama/api.md
      - İmza Formatları ve Doğrulama API: signature-verification.md
  - API Referansı:
      - Süreç:
          - Süreç API: progress.md
          - Süreç Taslakları API: process-definitions.md
          - Döküman API: documents.md
          - Taslaktan Döküman Ekleme: progress_doctype.md
          - İmzacı API: signers.md
          - Referans API: reference-api.md
      - İmzalama:
          - Dosya İmzalama (CAdES/ASiC-E): dosya-imzalama.md
          - Bulut İmzalama (Autosign): autosign.md
          - Sümen API: sumen-api.md
      - Login:
          - E-İmza Login API: esign.md
          - Mobil İmza Login API: mobilsign.md
      - Webhook: webhook.md
  - Örnekler:
      - Taslaktan Dinamik Süreç Başlatma: examples/taslaktan-dinamik-surec.md
      - Abonelik Sözleşmesi İmzalama: examples/abonelik-sozlesmesi.md
      - Karşılıklı Elektronik Sözleşme İmzalama: examples/karsilikli-sozlesme-imzalama.md
      - Üyelik Kimlik Doğrulama: examples/uyelik-kimlik-dogrulama.md
      - Uygulama İçi E-imza: examples/uygulama-ici-eimza.md
      - Uygulama İçi Mobil İmza: examples/uygulama-ici-mobil-imza.md
extra_css:
  - assets/extra.css

extra:
  analytics:
    provider: google
    property: G-Z4PJ77FKJD


markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight


plugins:
  - search
 
