version: "3.9"
services:
  docs:
    container_name: dijitalbelge-docs
    build: .
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dijitalbelgedokumanhttp.rule=Host(`dokuman.dijitalbelge.com`)"
      - "traefik.http.routers.dijitalbelgedokumanhttp.entrypoints=web"
      - "traefik.http.routers.dijitalbelgedokumanhttp.middlewares=redirecthttps"

      # Middleware tanımı (bu servis üzerinde tanımlanmalı, aksi halde "does not exist" hatası verir)
      - "traefik.http.middlewares.redirecthttps.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirecthttps.redirectscheme.permanent=true"

      - "traefik.http.routers.dijitalbelgedokuman.rule=Host(`dokuman.dijitalbelge.com`)"
      - "traefik.http.routers.dijitalbelgedokuman.entrypoints=websecure"
      - "traefik.http.routers.dijitalbelgedokuman.tls.certresolver=myresolver"
      - "traefik.http.services.dijitalbelgedokuman.loadbalancer.server.port=80"

    #ports:
    #  - "8085:80"
    volumes:
      - .:/docs
    restart: unless-stopped

networks:
  web:
    external: true
