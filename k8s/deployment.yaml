apiVersion: apps/v1
kind: Deployment
metadata:
  name: dijitalbelge-docs
  namespace: dijitalbelge
  labels:
    app: dijitalbelge-docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dijitalbelge-docs
  template:
    metadata:
      labels:
        app: dijitalbelge-docs
    spec:
      imagePullSecrets:
        - name: harbor-cred
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dijitalbelge-docs
      containers:
        - name: nginx
          image: harbor.fullcheck.app/dijitalbelge/dokuman2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dijitalbelge-docs
  namespace: dijitalbelge
spec:
  selector:
    app: dijitalbelge-docs
  ports:
    - name: http
      port: 80
      targetPort: http
